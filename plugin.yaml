manifest_version: 1
api_version: 1
name: hermes-mobile
version: 1.6.0
description: Secure profile-scoped mobile API, scheduled tasks, attachments, sync and push for Hermes Gateway.
author: Hermes Mobile contributors
kind: standalone
license: MIT
homepage: https://github.com/NousResearch/hermes-agent
platforms:
  - linux
  - macos
provides_tools:
  - mobile_attachment_read
provides_hooks:
  - on_session_end
python_dependencies:
  - aiohttp>=3.10,<4
  - cryptography>=43,<51
  - pydantic>=2.9,<3
  - PyYAML>=6,<7
  - qrcode>=8,<9
  - webauthn>=3,<4
config_schema:
  public_base_url:
    type: str
    default: ""
    description: Public HTTPS origin, without a path, used by WebAuthn and paired clients.
  loopback_base_url:
    type: str
    default: http://127.0.0.1:8642
    description: Internal Hermes API listener used by HermesFacade.
  access_token_ttl_seconds:
    type: int
    default: 900
  refresh_token_ttl_days:
    type: int
    default: 90
  pairing_ttl_seconds:
    type: int
    default: 600
  max_file_bytes:
    type: int
    default: 52428800
  max_attachments_per_turn:
    type: int
    default: 10
  push:
    type: dict
    default: {enabled: true, provider: expo, timeout_seconds: 10, max_attempts: 8}
  files:
    type: dict
    default: {enabled: true, ocr_enabled: false}
  quick:
    type: dict
    default:
      enabled: true
      toolsets: [search]
      max_iterations: 8
      timeout_seconds: 180
    description: >-
      Lightweight turn mode: no memory, context files, MCP or review; only the
      listed web-search toolsets. The client opts in per run with mode=quick.
tags:
  - mobile
  - api
  - expo
  - self-hosted
