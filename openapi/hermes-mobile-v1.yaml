components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    MobileError:
      description: Typed mobile error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              pattern: ^req_
            retryable:
              type: boolean
            details:
              type: object
    RunEvent:
      type: object
      required:
      - event_id
      - sequence
      - type
      - run_id
      - conversation_id
      - created_at
      - data
      properties:
        event_id:
          type: string
        sequence:
          type: integer
        type:
          type: string
        run_id:
          type: string
        conversation_id:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          type: object
    ReasoningEffort:
      type: string
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
      - ultra
    ModelReasoning:
      type: object
      required:
      - supported
      - can_disable
      - efforts
      properties:
        supported:
          type: boolean
        can_disable:
          type:
          - boolean
          - 'null'
        efforts:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningEffort'
    ModelInfo:
      type: object
      required:
      - id
      - name
      - reasoning
      properties:
        id:
          type: string
        name:
          type: string
        reasoning:
          $ref: '#/components/schemas/ModelReasoning'
    ModelsResponse:
      type: object
      required:
      - items
      - default
      - default_reasoning_effort
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        default:
          type:
          - string
          - 'null'
        default_reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
    SyncChange:
      type: object
      required:
      - type
      - entity
      - id
      properties:
        type:
          type: string
        entity:
          type: object
          additionalProperties: true
        id:
          type: string
    SyncResponse:
      type: object
      required:
      - changes
      - next_cursor
      - has_more
      - server_time
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor:
          type: string
        has_more:
          type: boolean
        server_time:
          type: string
          format: date-time
    ConversationCreateInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 200
        model:
          type:
          - string
          - 'null'
          maxLength: 200
        reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
    ConversationPatchInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 200
        archived:
          type:
          - boolean
          - 'null'
        pinned:
          type:
          - boolean
          - 'null'
        model:
          type:
          - string
          - 'null'
          maxLength: 200
        reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
    InboxAction:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - answer_approval
          - open_conversation
          - create_conversation
          - reply
        conversation_id:
          type: string
        run_id:
          type: string
        approval_id:
          type: string
        decisions:
          type: array
          items:
            type: string
            enum:
            - allow_once
            - allow_session
            - always_allow
            - deny
    InboxItem:
      type: object
      required:
      - id
      - kind
      - severity
      - title
      - body
      - source
      - conversation_id
      - context
      - actions
      - unread
      - resolved
      - occurred_at
      - read_at
      - resolved_at
      - updated_at
      properties:
        id:
          type: string
        kind:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - error
          - action_required
        title:
          type: string
        body:
          type: string
        source:
          type: object
          additionalProperties: false
          required:
          - type
          - id
          properties:
            type:
              type: string
            id:
              type:
              - string
              - 'null'
        conversation_id:
          type:
          - string
          - 'null'
        context:
          type: object
        actions:
          type: array
          items:
            $ref: '#/components/schemas/InboxAction'
        unread:
          type: boolean
        resolved:
          type: boolean
        occurred_at:
          type: string
          format: date-time
        read_at:
          type:
          - string
          - 'null'
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
    InboxPage:
      type: object
      required:
      - items
      - has_more
      - unread_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
        unread_count:
          type: integer
    InboxConversationInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 200
    RunInputBlock:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - text
        properties:
          type:
            const: text
          text:
            type: string
            minLength: 1
            maxLength: 100000
      - type: object
        additionalProperties: false
        required:
        - type
        - attachment_id
        properties:
          type:
            const: attachment
          attachment_id:
            type: string
    RunCreateInput:
      type: object
      additionalProperties: false
      required:
      - client_message_id
      - input
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          type: string
          enum:
          - full
          - quick
          default: full
          description: 'quick runs a lightweight in-process agent: no memory, context
            files, MCP or end-of-turn review, only the configured web-search toolsets.
            The turn still persists to the conversation history and streams the same
            events.'
        input:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RunInputBlock'
    InboxReplyInput:
      type: object
      additionalProperties: false
      required:
      - client_message_id
      - input
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
        conversation_title:
          type:
          - string
          - 'null'
          maxLength: 200
        input:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RunInputBlock'
    RunAccepted:
      type: object
      additionalProperties: false
      required:
      - run_id
      - conversation_id
      - user_message_id
      - status
      - mode
      - events_url
      properties:
        run_id:
          type: string
        conversation_id:
          type: string
        user_message_id:
          type:
          - string
          - 'null'
        status:
          type: string
        mode:
          type: string
          enum:
          - full
          - quick
          default: full
          description: Echoes the mode the run was served with so clients can distinguish
            quick turns and detect transparent fallback to the full flow.
        events_url:
          type: string
    InboxReadAllResult:
      type: object
      additionalProperties: false
      required:
      - updated
      properties:
        updated:
          type: integer
          minimum: 0
