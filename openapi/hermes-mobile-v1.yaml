components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    MobileError:
      description: Typed mobile error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              pattern: ^req_
            retryable:
              type: boolean
            details:
              type: object
    RunEvent:
      type: object
      required:
      - event_id
      - sequence
      - type
      - run_id
      - conversation_id
      - created_at
      - data
      properties:
        event_id:
          type: string
        sequence:
          type: integer
        type:
          type: string
        run_id:
          type: string
        conversation_id:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          type: object
    ReasoningEffort:
      type: string
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
      - ultra
    ModelReasoning:
      type: object
      required:
      - supported
      - can_disable
      - efforts
      properties:
        supported:
          type: boolean
        can_disable:
          type:
          - boolean
          - 'null'
        efforts:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningEffort'
    ModelInfo:
      type: object
      required:
      - id
      - name
      - reasoning
      properties:
        id:
          type: string
        name:
          type: string
        reasoning:
          $ref: '#/components/schemas/ModelReasoning'
    ModelsResponse:
      type: object
      required:
      - items
      - default
      - default_reasoning_effort
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        default:
          type:
          - string
          - 'null'
        default_reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
    ConversationCreateInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 200
        model:
          type:
          - string
          - 'null'
          maxLength: 200
        reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
    ConversationPatchInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 200
        archived:
          type:
          - boolean
          - 'null'
        pinned:
          type:
          - boolean
          - 'null'
        model:
          type:
          - string
          - 'null'
          maxLength: 200
        reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
