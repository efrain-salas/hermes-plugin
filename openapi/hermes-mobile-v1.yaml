openapi: 3.1.0
info:
  title: Hermes Mobile API
  version: 1.0.0
  description: Stable profile-scoped mobile contract.
servers:
- url: https://hermes.example.com
paths:
  /p/{profile}/v1/mobile/health:
    get:
      operationId: health
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
  /p/{profile}/v1/mobile/capabilities:
    get:
      operationId: getCapabilities
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/bootstrap:
    get:
      operationId: bootstrap
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/auth/pair:
    post:
      operationId: pair
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/auth/logout:
    post:
      operationId: logout
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/me:
    get:
      operationId: me
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/devices:
    get:
      operationId: listDevices
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
    post:
      operationId: upsertDevice
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/devices/{device_id}:
    patch:
      operationId: patchDevice
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
    delete:
      operationId: deleteDevice
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/conversations:
    get:
      operationId: listConversations
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
    post:
      operationId: createConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateInput'
  /p/{profile}/v1/mobile/conversations/{conversation_id}:
    get:
      operationId: getConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
    patch:
      operationId: patchConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatchInput'
    delete:
      operationId: deleteConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/conversations/{conversation_id}/fork:
    post:
      operationId: forkConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/conversations/{conversation_id}/read:
    post:
      operationId: readConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/conversations/{conversation_id}/runs:
    post:
      operationId: createRun
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
        '202':
          description: Run accepted as an asynchronous turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '409':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateInput'
  /p/{profile}/v1/mobile/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/runs/{run_id}/steer:
    post:
      operationId: steerRun
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/runs/{run_id}/approvals/{approval_id}:
    post:
      operationId: answerApproval
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /p/{profile}/v1/mobile/runs/{run_id}/retry:
    post:
      operationId: retryRun
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/inbox:
    get:
      operationId: listInbox
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: unread
        in: query
        required: false
        description: true returns unread items; false returns read items
        schema:
          type: boolean
      - name: kind
        in: query
        required: false
        description: Exact activity kind or dotted-prefix family
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9_.-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Unified durable activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/inbox/read-all:
    post:
      operationId: readAllInbox
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unread items marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxReadAllResult'
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/inbox/{inbox_item_id}:
    get:
      operationId: getInboxItem
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: inbox_item_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unified durable activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/inbox/{inbox_item_id}/read:
    post:
      operationId: readInboxItem
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: inbox_item_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unified durable activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/inbox/{inbox_item_id}/conversation:
    post:
      operationId: createInboxConversation
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: inbox_item_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Existing linked conversation
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
        '201':
          description: Conversation created and linked
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxConversationInput'
  /p/{profile}/v1/mobile/inbox/{inbox_item_id}/reply:
    post:
      operationId: replyToInboxItem
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: inbox_item_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
        '202':
          description: Reply accepted as an asynchronous run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '409':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxReplyInput'
  /p/{profile}/v1/mobile/scheduled-tasks:
    get:
      operationId: listScheduledTasks
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
  /p/{profile}/v1/mobile/scheduled-tasks/{scheduled_task_id}:
    get:
      operationId: getScheduledTask
      parameters:
      - name: profile
        in: path
        required: true
        schema:
          type: string
      - name: scheduled_task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/MobileError'
        '401':
          $ref: '#/components/responses/MobileError'
        '404':
          $ref: '#/components/responses/MobileError'
        '500':
          $ref: '#/components/responses/MobileError'
      security:
      - mobileBearer: []
